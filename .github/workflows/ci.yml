name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-scan-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- Functional tests ---------------------------------------------
      - name: Run tests (pytest)
        run: python -m pytest -q

      # ---- SAST: static analysis with Bandit ----------------------------
      - name: SAST - Bandit
        run: |
          bandit -r app -f html -o bandit-report.html
          bandit -r app -q
        continue-on-error: false

      # ---- SCA: dependency audit with Safety ----------------------------
      - name: SCA - Safety (dependency vulnerabilities)
        run: |
          safety check -r requirements.txt --save-json safety-report.json
        continue-on-error: false

      # ---- Upload scanner reports as artifacts --------------------------
      - name: Upload scanner reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-reports
          path: |
            bandit-report.html
            safety-report.json
          if-no-files-found: warn
